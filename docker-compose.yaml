services:
  snaps:
    image: snaps-app:local
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: snaps
    restart: always
    environment:
      # === Required Settings
      MAIN_URL: 'http://localhost:4007'
      FRONTEND_URL: 'http://localhost:4007'
      NEXT_PUBLIC_BACKEND_URL: 'http://localhost:4007/api'
      JWT_SECRET: 'random string that is unique to every install - just type random characters here!'
      DATABASE_URL: 'postgresql://snaps-user:snaps-password@snaps-postgres:5432/snaps-db-local'
      REDIS_URL: 'redis://snaps-redis:6379'
      BACKEND_INTERNAL_URL: 'http://localhost:3000'
      TEMPORAL_ADDRESS: "temporal:7233"
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'false'

      # === Storage Settings
      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'

      # === Cloudflare (R2) Settings
      # STORAGE_PROVIDER: 'cloudflare'
      # CLOUDFLARE_ACCOUNT_ID: 'your-account-id'
      # CLOUDFLARE_ACCESS_KEY: 'your-access-key'
      # CLOUDFLARE_SECRET_ACCESS_KEY: 'your-secret-access-key'
      # CLOUDFLARE_BUCKETNAME: 'your-bucket-name'
      # CLOUDFLARE_BUCKET_URL: 'https://your-bucket-url.r2.cloudflarestorage.com/'
      # CLOUDFLARE_REGION: 'auto'

      # === Social Media API Settings
      X_URL: ''
      X_API_KEY: ''
      X_API_SECRET: ''
      LINKEDIN_CLIENT_ID: ''
      LINKEDIN_CLIENT_SECRET: ''
      REDDIT_CLIENT_ID: ''
      REDDIT_CLIENT_SECRET: ''
      GITHUB_CLIENT_ID: ''
      GITHUB_CLIENT_SECRET: ''
      BEEHIIVE_API_KEY: ''
      BEEHIIVE_PUBLICATION_ID: ''
      THREADS_APP_ID: ''
      THREADS_APP_SECRET: ''
      FACEBOOK_APP_ID: ''
      FACEBOOK_APP_SECRET: ''
      YOUTUBE_CLIENT_ID: ''
      YOUTUBE_CLIENT_SECRET: ''
      TIKTOK_CLIENT_ID: ''
      TIKTOK_CLIENT_SECRET: ''
      PINTEREST_CLIENT_ID: ''
      PINTEREST_CLIENT_SECRET: ''
      DRIBBBLE_CLIENT_ID: ''
      DRIBBBLE_CLIENT_SECRET: ''
      DISCORD_CLIENT_ID: ''
      DISCORD_CLIENT_SECRET: ''
      DISCORD_BOT_TOKEN_ID: ''
      SLACK_ID: ''
      SLACK_SECRET: ''
      SLACK_SIGNING_SECRET: ''
      MASTODON_URL: 'https://mastodon.social'
      MASTODON_CLIENT_ID: ''
      MASTODON_CLIENT_SECRET: ''

      # === OAuth & Authentik Settings
      # NEXT_PUBLIC_POSTIZ_OAUTH_DISPLAY_NAME: 'Authentik'
      # NEXT_PUBLIC_POSTIZ_OAUTH_LOGO_URL: 'https://raw.githubusercontent.com/walkxcode/dashboard-icons/master/png/authentik.png'
      # POSTIZ_GENERIC_OAUTH: 'false'
      # POSTIZ_OAUTH_URL: 'https://auth.example.com'
      # POSTIZ_OAUTH_AUTH_URL: 'https://auth.example.com/application/o/authorize'
      # POSTIZ_OAUTH_TOKEN_URL: 'https://auth.example.com/application/o/token'
      # POSTIZ_OAUTH_USERINFO_URL: 'https://authentik.example.com/application/o/userinfo'
      # POSTIZ_OAUTH_CLIENT_ID: ''
      # POSTIZ_OAUTH_CLIENT_SECRET: ''
      # POSTIZ_OAUTH_SCOPE: "openid profile email"  # Optional: uncomment to override default scope

      # === Sentry

      # NEXT_PUBLIC_SENTRY_DSN: 'http://spotlight:8969/stream'
      # SENTRY_SPOTLIGHT: '1'

      # === Misc Settings
      OPENAI_API_KEY: ''
      NEXT_PUBLIC_DISCORD_SUPPORT: ''
      NEXT_PUBLIC_POLOTNO: ''
      API_LIMIT: 30

      # === snaps AI / Korean SNS Settings
      NEXT_PUBLIC_POSTIZ_OAUTH_DISPLAY_NAME: 'snaps'
      NEXT_PUBLIC_POSTIZ_OAUTH_LOGO_URL: ''
      NEXT_PUBLIC_SNAPS_EXTENSION_URL: ''
      AI_PROVIDER: 'ollama'
      SNAPS_LLM_PROVIDER: 'ollama'
      DEEPSEEK_API_KEY: &deepseek_api_key ''
      DEEPSEEK_BASE_URL: 'https://api.deepseek.com'
      DEEPSEEK_CHAT_MODEL: 'deepseek-v4-flash'
      DEEPSEEK_CHAT_TIMEOUT_MS: 120000
      # The Ollama path has had its temperature and length budget here for a
      # while; the DeepSeek path is the one actually in use and had neither,
      # so it could not be tuned in the container at all.
      DEEPSEEK_TEMPERATURE: 0.35
      DEEPSEEK_MAX_TOKENS: 16000
      OLLAMA_BASE_URL: 'http://host.docker.internal:11434'
      OLLAMA_CHAT_MODEL: 'qwen3.5:9b'
      OLLAMA_EMBED_MODEL: 'nomic-embed-text:latest'
      OLLAMA_TEMPERATURE: 0.35
      OLLAMA_NUM_PREDICT: 4096
      OLLAMA_CHAT_TIMEOUT_MS: 120000
      OLLAMA_EMBED_TIMEOUT_MS: 60000
      OLLAMA_DISABLE_THINKING: 'true'
      SNAPS_RAG_ENABLED: 'true'
      SNAPS_RAG_TOP_K: 5
      SNAPS_ALLOW_RULE_FALLBACK: 'true'
      SNAPS_DATA_DIR: '/config/snaps'
      # Logs the underlying error when a transform or a DeepSeek call fails.
      # Off by default; uncomment to diagnose a failing container.
      # SNAPS_DEBUG_TRANSFORM: '1'
      PIXELLE_VIDEO_URL: 'http://snaps-pixelle-video:8000'
      # Deadlines for the video HTTP calls. fetch() has no default timeout, so a
      # render service that accepts the connection and then stops answering
      # would hold a backend request open indefinitely. Rendering is slow, so
      # the submit budget is generous while status polls give up quickly.
      PIXELLE_TIMEOUT_MS: 120000
      PIXELLE_STATUS_TIMEOUT_MS: 30000
      SHORTS_MAKER_URL: 'http://snaps-shorts-maker:4100'
      SHORTS_MAKER_TIMEOUT_MS: 120000
      SHORTS_MAKER_STATUS_TIMEOUT_MS: 30000
      # How long a single channel's analytics may take before the report
      # skips it with a warning. A provider that accepts the connection and
      # stalls is a wait, not an error, and the loop had nothing to end it.
      SNAPS_ANALYTICS_TIMEOUT_MS: 15000
      NAVER_CLIENT_ID: ''
      NAVER_CLIENT_SECRET: ''

      # === Payment / Stripe Settings
      FEE_AMOUNT: 0.05
      STRIPE_PUBLISHABLE_KEY: ''
      STRIPE_SECRET_KEY: ''
      STRIPE_SIGNING_KEY: ''
      STRIPE_SIGNING_KEY_CONNECT: ''

      # === Developer Settings
      NX_ADD_PLUGINS: false

      # === Short Link Service Settings (Optional - leave blank if unused)
      # DUB_TOKEN: ""
      # DUB_API_ENDPOINT: "https://api.dub.co"
      # DUB_SHORT_LINK_DOMAIN: "dub.sh"
      # SHORT_IO_SECRET_KEY: ""
      # KUTT_API_KEY: ""
      # KUTT_API_ENDPOINT: "https://kutt.it/api/v2"
      # KUTT_SHORT_LINK_DOMAIN: "kutt.it"
      # LINK_DRIP_API_KEY: ""
      # LINK_DRIP_API_ENDPOINT: "https://api.linkdrip.com/v1/"
      # LINK_DRIP_SHORT_LINK_DOMAIN: "dripl.ink"

    volumes:
      - snaps-config:/config/
      - snaps-uploads:/uploads/
    ports:
      - "4007:5000"
    networks:
      - snaps-network
      - temporal-network
    depends_on:
      snaps-postgres:
        condition: service_healthy
      snaps-redis:
        condition: service_healthy
      snaps-pixelle-video:
        condition: service_started
      snaps-shorts-maker:
        condition: service_started

  snaps-pixelle-video:
    build:
      context: ./external/Pixelle-Video
      dockerfile: Dockerfile
      args:
        USE_CN_MIRROR: 'false'
    container_name: snaps-pixelle-video
    command: .venv/bin/python api/app.py --host 0.0.0.0 --port 8000
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    volumes:
      - ./external/Pixelle-Video/config.yaml:/app/config.yaml
      - ./external/Pixelle-Video/output:/app/output
      - ./external/Pixelle-Video/data:/app/data
    # This publishes the Pixelle API on the host so its web UI is reachable at
    # localhost:8000. Note what that exposes: api/app.py adds CORS and nothing
    # else - /generate, /status/{job_id} and the file routes take no API key,
    # no session and no Authorization header - so anything that can reach this
    # host on 8000 can queue video generation work and read its output. The
    # sibling snaps-shorts-maker service deliberately publishes no port for the
    # same reason. Bind it to "127.0.0.1:8000:8000" if the UI only needs to be
    # reachable from this machine.
    ports:
      - "8000:8000"
    networks:
      - snaps-network
      - temporal-network
    depends_on:
      snaps-postgres:
        condition: service_healthy
      snaps-redis:
        condition: service_healthy

  # snaps-shorts-maker runs alongside snaps-pixelle-video as a second, independent
  # shorts-video-production engine (see docs/snaps-shorts-maker.md). It is a vendored
  # Next.js + Remotion app (external/Shorts-Maker) reachable only inside the docker
  # network at http://snaps-shorts-maker:4100 - its port is intentionally NOT published.
  snaps-shorts-maker:
    build:
      context: ./external/Shorts-Maker
      dockerfile: Dockerfile
    container_name: snaps-shorts-maker
    restart: unless-stopped
    environment:
      APP_BASE_URL: 'http://snaps-shorts-maker:4100'
      NEXT_PUBLIC_APP_URL: 'http://snaps-shorts-maker:4100'
      AUTH_SESSION_SECRET: 'random string that is unique to every install - just type random characters here!'

      # NODE_ENV=development is intentional here, not a mistake: lib/auth/local-bypass.ts
      # only allows AUTH_LOCAL_BYPASS when NODE_ENV !== "production". This container is
      # never reachable outside the internal docker network (no `ports:` mapping below),
      # so using the local-bypass auth is the correct, minimal-touch way to let the
      # snaps backend call it without a real login flow. See docs/snaps-shorts-maker.md.
      NODE_ENV: 'development'
      AUTH_LOCAL_BYPASS: 'true'
      LOCAL_AUTH_BYPASS_ROLE: 'admin'

      AI_PROVIDER: 'deepseek'
      DEEPSEEK_API_KEY: *deepseek_api_key
      DEEPSEEK_MODEL: 'deepseek-chat'

      # Reuses the existing snaps-postgres container with its own database
      # (shorts-maker-db-local) instead of requiring a real Supabase project. The
      # database itself must be created and external/Shorts-Maker/scripts/local-postgres-schema.sql
      # applied to it once, manually - see docs/snaps-shorts-maker.md.
      LOCAL_POSTGRES_URL: 'postgresql://snaps-user:snaps-password@snaps-postgres:5432/shorts-maker-db-local'

      # Rendered videos/uploads persist here across container restarts (see the
      # shorts-maker-storage volume below).
      LOCAL_STORAGE_ROOT: '/data/shorts-maker-storage'

      # ffmpeg is installed on $PATH in external/Shorts-Maker/Dockerfile.
      STUDIO_FFMPEG_PATH: 'ffmpeg'
      FFMPEG_PATH: 'ffmpeg'

      # === TTS / image provider settings.
      # Image providers below are optional: image-provider-resolver falls back
      # across the configured ones, and openverse/wikimedia need no key.
      # TYPECAST is NOT optional if you want rendered video - it is the only TTS
      # engine and lib/studio/tts-typecast.ts throws "TYPECAST_API_KEY가 필요합니다."
      # without it, so narration (and therefore the render) cannot complete.
      # See docs/snaps-shorts-maker.md.
      TYPECAST_API_KEY: ''
      TYPECAST_BASE_URL: ''
      NAVER_CLIENT_ID: ''
      NAVER_CLIENT_SECRET: ''
      PEXELS_API_KEY: ''
      PIXABAY_API_KEY: ''
      GIPHY_API_KEY: ''
    volumes:
      - shorts-maker-storage:/data/shorts-maker-storage
    networks:
      - snaps-network
      - temporal-network
    depends_on:
      snaps-postgres:
        condition: service_started

  snaps-postgres:
    image: postgres:17-alpine
    container_name: snaps-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: snaps-password
      POSTGRES_USER: snaps-user
      POSTGRES_DB: snaps-db-local
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - snaps-network
    healthcheck:
      test: pg_isready -U snaps-user -d snaps-db-local
      interval: 10s
      timeout: 3s
      retries: 3
  snaps-redis:
    image: redis:7.2
    container_name: snaps-redis
    restart: always
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - snaps-redis-data:/data
    networks:
      - snaps-network

  # For Application Monitoring / Debugging
  spotlight:
    pull_policy: always
    container_name: spotlight
    ports:
      - 8969:8969/tcp
    image: ghcr.io/getsentry/spotlight:latest
    networks:
      - snaps-network

  # -----------------------
  # Temporal Stack
  # -----------------------
  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:7.17.27
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - temporal-network
    expose:
      - 9200
    volumes:
      - /var/lib/elasticsearch/data

  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    networks:
      - temporal-network
    expose:
      - 5432
    volumes:
      - /var/lib/postgresql/data

  temporal:
    container_name: temporal
    ports:
      - '7233:7233'
    image: temporalio/auto-setup:1.28.1
    depends_on:
      - temporal-postgresql
      - temporal-elasticsearch
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    networks:
      - temporal-network
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    labels:
      kompose.volume.type: configMap

  temporal-admin-tools:
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - temporal-network
    stdin_open: true
    depends_on:
      - temporal
    tty: true

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:2.34.0
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://127.0.0.1:3000
    networks:
      - temporal-network
    ports:
      - '8080:8080'

volumes:
  postgres-volume:
    external: false

  snaps-redis-data:
    external: false

  snaps-config:
    external: false

  snaps-uploads:
    external: false

  shorts-maker-storage:
    external: false

networks:
  snaps-network:
    external: false
  temporal-network:
    driver: bridge
    name: temporal-network
